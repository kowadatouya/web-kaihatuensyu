<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" 
    crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>お問い合わせ 個人</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top header-gradient">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="./img/logo.png" alt="Bootstrap">
            </a>
            <a class="navbar-brand" href="index.html">早池峰設備工業</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="company_info.html">会社案内</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="Achive.html">実績</a></li>
                    <li class="nav-item"><a class="nav-link" href="Recruitment.html">採用情報</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#zigyou">サービス案内</a></li>
                    <li class="nav-item"><a class="nav-link" href="inquiry.html">お問い合わせ</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="individual-inquiry-header"></div>
    <div class="border-inquiry">
        <h1 class="inquiry-midasi">お気軽にお問い合わせください。</h1>
        <div class="yokonarabi-inquiry">
            <h1><img src="./img/tel.png"width="50" height="50">019-600-0000</h1>
            <h1><img src="./img/fax.png"width="50" height="50">019-600-0001</h1>
        </div>
    </div>
    <div class="inquiry-form">
        <h1 class="inquiry-midasi">お問い合わせフォーム</h1>
        <div class="yokonaarabi-inquiry">
            <div class="yokonarabi-radio"><input type="radio" class="inquiry-radio" name="inquiry" value="依頼"><h1>依頼</h1></div>
            <div class="yokonarabi-radio"><input type="radio" class="inquiry-radio" name="inquiry" value="ご意見・ご要望"><h1>ご意見・ご要望</h1></div>
        </div>
        <div class="yokonarabi-text-inquiry">
            <h1 class="inquiry-detail">お名前<span style="color:red;">*</span></h1>
            <input class="text-inquiry" name="name" type="text">
        </div>
        <div class="yokonarabi-text-inquiry">
            <h1 class="inquiry-detail">フリガナ<span style="color:red;">*</span></h1>
            <input class="text-inquiry" name="furi" type="text">
        </div>
        <div class="yokonarabi-text-inquiry">
            <h1 class="inquiry-detail">Eメールアドレス<span style="color:red;">*</span></h1>
            <input class="text-inquiry" name="mail" type="text">
        </div>
        <div class="yokonarabi-text-inquiry">
            <h1 class="inquiry-detail">住所<span style="color:red;">*</span></h1>
            <input class="text-inquiry" name="address" type="text">
        </div>
        <div class="yokonarabi-text-inquiry">
            <h1 class="inquiry-detail">郵便番号<span style="color:red;">*</span></h1>
            <input class="text-inquiry" name="zipcode" type="text">
        </div>
        <div class="yokonarabi-text-inquiry">
            <h1 class="inquiry-detail-textarea">お問い合わせ<span style="color:red;">*</span><br>内容</h1>
            <textarea class="text-inquiry" name="detail" rows="10"></textarea>
        </div>
        <button class="form-button" onclick="confirmRequest()"><h1>送信</h1></button>
    </div>
    <footer class="temp-footer">
        <div class="yokonarabi-footer">
            <a class="footer-border" href="company_info.html">会社案内</a>
            <a class="footer-border" href="Recruitment.html#seikyu">資料請求</a>
            <a class="footer-border" href="Recruitment.html">採用情報</a>
            <a class="footer-border" href="inquiry.html">お問い合わせ</a>
            <a class="footer-border" href="Achive.html">実績</a>
        </div>
        <h1 class="center"><img src="./img/logo.png" width="50" height="50">早池峰設備工業</h1>
    </footer>
<script>
function confirmRequest() {
    const inquiryElem = document.querySelector('[name="inquiry"]:checked');
    const inquiry = inquiryElem ? inquiryElem.value : '';
    const name = document.querySelector('[name="name"]').value.trim();
    const furi = document.querySelector('[name="furi"]').value.trim();
    const mail = document.querySelector('[name="mail"]').value.trim();
    const address = document.querySelector('[name="address"]').value.trim();
    const zipcode = document.querySelector('[name="zipcode"]').value.trim();
    const detail = document.querySelector('[name="detail"]').value;

    // 未入力チェック
    if (!inquiry ||!name ||!mail || !zipcode || !address || !detail) {
        alert('すべての項目を入力してください。');
        return;
    }

    // confirm ダイアログ
    const result = confirm(
        '次の内容で送信します\n\n' +
        `ご用件：${inquiry}\n` +
        `名前：${name}\n` +
        `フリガナ：${name}\n` +
        `Eメールアドレス：${mail}\n` +
        `郵便番号：${zipcode}\n` +
        `住所：${address}\n` +
        `お問い合わせ内容：${detail}\n\n`+
        'よろしいですか？' 
    );

    if (result) {
        alert('お問い合わせを受け付けました。');
    } else {
    }
}
</script>
</body>
</html>
